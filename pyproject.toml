[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-omni-adapters"
version = "0.1.0"
description = "Standalone Ollama-compatible audio, image, and video routing for logical Qwen Omni bundles"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Robit"}]
dependencies = [
  "Flask>=3.0,<4",
  "bleak>=2.1.1,<3",
  "gguf>=0.10",
  "httpx>=0.27,<1",
  "jsonschema>=4,<5",
  "mcp>=1.26,<2",
  "numpy>=1.26",
  "Pillow>=10,<13",
  "PyYAML>=6.0,<7",
  "waitress>=3.0,<4",
  "zxing-cpp>=3,<3.2; platform_system == 'Linux' and python_version < '3.11'",
  "zxing-cpp>=3,<4; platform_system == 'Linux' and python_version >= '3.11'",
  "pywin32>=308; platform_system == 'Windows'",
]

[project.optional-dependencies]
camera-orientation = ["onnxruntime>=1.18,<2"]
pdf = ["pdfplumber>=0.11.5,<0.12"]
dev = [
  "jsonschema>=4,<5",
  "pytest>=8,<10",
  "ruff>=0.13",
]

[project.scripts]
omni-adapters = "qwen_omni_adapters.cli:main"
omni-adapters-daemon = "qwen_omni_adapters.daemon:main"
qwen-omni = "qwen_omni_adapters.cli:main"
qwen-omni-daemon = "qwen_omni_adapters.daemon:main"

[project.urls]
Repository = "https://github.com/robit-man/qwen-omni-adapters"
Documentation = "https://github.com/robit-man/qwen-omni-adapters/tree/main/docs"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qwen_omni_adapters = ["context.json", "decision-plane.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM105"]

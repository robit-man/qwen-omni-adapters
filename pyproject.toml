[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-omni-adapters"
version = "0.1.0"
description = "Standalone Ollama-compatible audio, image, and video routing for logical Qwen Omni bundles"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Robit"}]
dependencies = [
  "Flask>=3.0,<4",
  "gguf>=0.10",
  "httpx>=0.27,<1",
  "numpy>=1.26",
  "waitress>=3.0,<4",
  "pywin32>=308; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8",
]

[project.scripts]
qwen-omni = "qwen_omni_adapters.cli:main"
qwen-omni-daemon = "qwen_omni_adapters.daemon:main"

[project.urls]
Repository = "https://github.com/robit-man/qwen-omni-adapters"
Documentation = "https://github.com/robit-man/qwen-omni-adapters/tree/main/docs"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM105"]

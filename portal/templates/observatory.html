<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020101">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Recorded Omni runtime activity">
  <title>Runtime scope</title>
  <link rel="stylesheet" href="/assets/reference-rf-observatory.css?v=8">
  <script src="/assets/reference-rf-observatory.js?v=15" defer></script>
</head>
<body>
  <main id="shell" aria-label="Omni activity scope" aria-busy="true" data-model="{{ model }}" data-session-scope="{{ session_scope }}">
    <div class="stage">
      <canvas id="scope" width="910" height="1630" tabindex="0" aria-label="Recorded runtime events. Use the arrow keys to select a channel and Enter to inspect a source."></canvas>
      <div id="scope-filters" role="group" aria-label="Plot filters"></div>
      <details id="scope-weights">
        <summary id="scope-weight-count" aria-label="Configured weight components">WEIGHTS --/--</summary>
        <dl id="scope-weight-list"></dl>
      </details>
      <details id="scope-window">
        <summary id="scope-window-value" aria-label="Time window, 5 minutes">5 min</summary>
        <div class="window-options">
          <button type="button" value="60">1 min</button>
          <button type="button" value="300" aria-current="true">5 min</button>
          <button type="button" value="600">10 min</button>
          <button type="button" value="900">15 min</button>
        </div>
      </details>
      <div id="scope-rail" role="group" aria-label="Scope channels"></div>
      <div id="packet-link" aria-hidden="true" hidden></div>
      <button id="packet-close" type="button" aria-label="Collapse packet history" aria-controls="packet-history" hidden></button>
      <section id="packet-history" hidden aria-labelledby="packet-channel">
        <div class="packet-surface">
          <header class="packet-header">
            <h2 id="packet-channel"></h2>
            <span id="packet-count"></span>
          </header>
          <ol id="packet-list" tabindex="0" aria-label="Recorded packets, oldest first"></ol>
          <p id="packet-empty" hidden>No retained packets for this channel.</p>
        </div>
      </section>
    </div>
    <div class="toolbar" aria-label="Display actions">
      <button id="btn-pause" aria-label="Pause" title="Pause or resume (Space)">Ⅱ</button>
      <button id="btn-reset" aria-label="Refresh" title="Refresh (R)">↻</button>
      <button id="btn-snapshot" aria-label="Capture image" title="Save PNG (P)">▣</button>
      <button id="btn-fullscreen" aria-label="Fullscreen" title="Fullscreen (F)">⛶</button>
      <button id="btn-settings" aria-label="Settings" title="Settings">≡</button>
    </div>
    <div id="paused-badge" hidden>⏸ PAUSED</div>
    <aside id="settings-panel" class="panel" hidden aria-label="Scope settings">
      <div class="panel-header"><h2>Scope settings</h2><button id="btn-close" aria-label="Close settings">×</button></div>
      <div class="row"><label for="window-control">Time window</label><select id="window-control"><option value="60">1 minute</option><option value="300" selected>5 minutes</option><option value="600">10 minutes</option><option value="900">15 minutes</option></select></div>
      <div class="row"><label for="channel-control">Channel</label><select id="channel-control"><option value="all">All channels</option><option value="none">No channels</option><option value="multiple" disabled>Multiple channels</option></select></div>
      <div class="row"><label for="event-control">Recorded event</label><select id="event-control"><option value="">Select an event</option></select></div>
      <div class="panel-actions"><button id="btn-source" type="button" disabled>Source</button><button id="btn-export" type="button">Export events</button></div>
      <p id="sample-status" class="notice" role="status">Reading runtime activity.</p>
      <p id="resource-status" class="notice">Reading CPU and GPU utilization.</p>
    </aside>
    <div id="hover-label" class="hover-label" aria-hidden="true"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="event-info" class="help" aria-labelledby="event-title">
      <h2 id="event-title"></h2><dl id="event-facts"></dl><p id="event-source"></p>
      <form method="dialog"><button>Close</button></form>
    </dialog>
  </main>
</body>
</html>
